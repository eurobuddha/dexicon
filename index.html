<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dexicon</title>
    <link rel="stylesheet" href="ui/layout.css">
    <style>
        .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }
        table.ladder { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.ladder td, table.ladder th { padding: 3px 6px; text-align: right; }
        table.ladder th { color: #888; font-weight: normal; }
        tr.ask td.px, .ask .px { color: #e5534b; } tr.bid td.px, .bid .px { color: #3fb950; }
        td.tag, .tag { color: #888; font-size: 10px; text-align: left; }
        .relay-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 12px; }
        .relay-row .ok { color: #3fb950; } .relay-row .bad { color: #e5534b; }
        input.wide, select.wide { width: 100%; box-sizing: border-box; margin-top: 4px; }
        .version-pill { font-size: 10px; color: #888; }
        .panel { border: 1px solid #333; padding: 8px; margin-top: 8px; }
        #take-panel[hidden] { display: none; }
        button { cursor: pointer; }
    </style>
</head>
<body>
<div id="app">
    <header id="topbar">
        <span class="title">Dexicon</span>
        <span class="version" id="app-version">v—</span>
        <span class="spacer"></span>
        <span class="bal"><span class="tok">identity</span><span id="my-id" class="mono">—</span></span>
    </header>

    <main id="panes">
        <section id="pane-orderbook">
            <h2>Book — MINIMA / MxUSD <span class="version-pill" id="book-meta"></span></h2>
            <div id="orderbook" class="empty">No relays configured</div>
            <div id="take-panel" class="panel" hidden>
                <h3 id="take-title" class="mono"></h3>
                <label>Amount (MINIMA)</label>
                <input class="wide" id="take-amount" type="number" step="0.00000001" min="0">
                <div id="take-summary" style="font-size:12px;margin-top:6px;color:#aaa;"></div>
                <div style="margin-top:6px;"><button id="take-confirm" disabled>Sign and send to maker</button> <button id="take-close">Close</button></div>
            </div>
        </section>

        <section id="pane-entry">
            <h2>Place an order</h2>
            <select class="wide" id="entry-side"><option value="sell">Sell MINIMA for MxUSD</option><option value="buy">Buy MINIMA with MxUSD</option></select>
            <input class="wide" id="entry-price" placeholder="price — MxUSD per MINIMA (≤ 8 dp)">
            <input class="wide" id="entry-amount" placeholder="amount — MINIMA (≤ 8 dp)">
            <button id="entry-submit" style="margin-top:6px;">Publish order</button>
            <p style="font-size:11px;color:#888;">Your coins stay in your node. The order lists the coins that back it; a fill is one transaction you co-sign automatically.</p>
            <h2 style="margin-top:16px;">Open orders</h2>
            <div id="my-orders" class="empty">No open orders</div>
            <h2 style="margin-top:16px;">Relays</h2>
            <div id="relays"></div>
            <input class="wide mono" id="relay-input" placeholder="https://host:port (the DEX relay cape)">
            <button id="relay-add" style="margin-top:4px;">Add relay</button>
        </section>

        <section id="pane-history">
            <h2>Fills</h2>
            <div id="fills" class="empty">No fills yet</div>
        </section>
    </main>

    <footer id="statusbar">
        <span>book poll:</span><span id="poll-status">idle</span>
        <span class="spacer" style="flex:1;"></span>
        <span id="status-msg"></span>
    </footer>
</div>

<script src="mds.js"></script>
<script src="lib/rhino_shim.js"></script>
<script src="vendor/nacl.js"></script>
<script src="vendor/blake.js"></script>
<script src="vendor/sha256.js"></script>
<script src="vendor/sha512.js"></script>
<script src="vendor/decimal.js"></script>
<script src="lib/hex.js"></script>
<script src="lib/flow.js"></script>
<script src="crypto/ax_sodium.js"></script>
<script src="lib/identity.js"></script>
<script src="lib/mdsw.js"></script>
<script src="lib/prng.js"></script>
<script src="lib/envelope.js"></script>
<script src="lib/relay.js"></script>
<script src="lib/fill.js"></script>
<script src="lib/maker.js"></script>
<script src="ui/app.js"></script>
</body>
</html>
